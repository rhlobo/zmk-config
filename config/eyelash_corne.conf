CONFIG_ZMK_KEYBOARD_NAME="Eyelash-Corne"
CONFIG_ZMK_POINTING=y

# Hardware requirement, not a lighting choice: the nice!view screens stay blank unless the
# board's backlight output (PWM0 on P1.13) is driven. Keep it at 100% and bind no &bl keys,
# since dimming or turning the backlight off would blank the screens. Verified on device
# 2026-11-19.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
